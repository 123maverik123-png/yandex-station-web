name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q server.py profiles.py managed_yam.py multi.py
      - run: python -m unittest discover -s tests -v
      - run: python server.py --help
      - run: python multi.py --help
      - run: node tests/test_renderer.mjs
      - run: node tests/test_paths.mjs
      - run: node tests/test_catalog.cjs
      - run: node tests/test_update_ui.cjs
