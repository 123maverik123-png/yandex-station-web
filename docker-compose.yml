services:
  panel:
    image: ghcr.io/dimap/yandex-lite2-web:latest
    # или собрать самому из исходников:
    # build: .
    container_name: yandex-lite2-web
    # host — чтобы сертификат HTTPS выписался на адрес сервера в локальной сети
    network_mode: host
    environment:
      ADB_SERIAL: "192.168.1.50"   # IP колонки (порт 5555 подставится сам)
      # PANEL_PORT: "8765"
      # PANEL_HTTPS_PORT: "8766"    # 0 — без HTTPS
    volumes:
      - ./data:/data
    restart: unless-stopped
